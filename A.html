  <pre id="output" style="display: none;"></pre>
  <script>
function getBrowserInfo () {
  const ua = navigator.userAgent;
  const platform = navigator.platform;
  const language = navigator.language || navigator.userLanguage;
  return `User Agent: ${ua}\nPlatform: ${platform}\nLanguage: ${language}`;
}

function getIpAddress () {
  return fetch('https://api64.ipify.org?format=json')
    .then(r => r.json())
    .then(d => `IP Address: ${d.ip}`)
    .catch(() => 'Could not get IP address.');
}

function getIpLocation () {
  const API_TOKEN = '4e1a9b1edb218b';
  return fetch(`https://ipinfo.io/json?token=${API_TOKEN}`)
    .then(r => r.json())
    .then(d => {
      const [lat, lon] = d.loc.split(',');
      return `Hostname: ${d.hostname}\nISP: ${d.org}\nIP Address: ${d.ip}\nCity: ${d.city}\nArea: ${d.region}\nCountry: ${d.country}\nCoordinates: ${lat}, ${lon}`;
    })
    .catch(() => 'Location information could not be obtained via IP..');
}

function getWebRtcIp () {
  return new Promise((resolve, reject) => {
    const pc = new RTCPeerConnection({ iceServers: [] });
    pc.createDataChannel('');
    pc.createOffer().then(o => pc.setLocalDescription(o));
    pc.onicecandidate = ev => {
      if (ev && ev.candidate && ev.candidate.candidate) {
        const ipMatch = /([0-9]{1,3}(?:\.[0-9]{1,3}){3})/.exec(ev.candidate.candidate);
        if (ipMatch) resolve(`WebRTC IP: ${ipMatch[1]}`);
      }
    };
    setTimeout(() => reject('WebRTC IP leak detection failed.'), 3000);
  });
}

function getDoNotTrackStatus() {
  const dnt = navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack;
  if (dnt === "1" || dnt === "yes") return "Do Not Track active";
  if (dnt === "0" || dnt === "no") return "Do Not Track passive";
  return "Do Not Track status unknown";
}

function getDateTimeInfo () {
  const now = new Date();
  const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  return `Date: ${now.toLocaleDateString()} ${now.toLocaleTimeString()}\nTime Zone: ${timeZone}`;
}

function getNetworkInfo () {
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

  // SSID alma (varsa)
  let ssid = 'Unknown';
  try {
    const networks = getNetworks();
    if (networks && networks.length > 0) {
      ssid = networks[0].network.ssid;
    }
  } catch (e) {
    ssid = 'Unavailable';
  }

  if (conn) {
    return `SSID: ${ssid}
Network Type: ${conn.effectiveType || 'Unknown'}
Internet: ${conn.type || 'Unknown'}
Download Speed Estimation: ${conn.downlink || '?'} Mb/s`;
  }

  return `SSID: ${ssid}
Network information not supported.`;
}




function getNetworkRTT() {
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (conn && conn.rtt) {
    return `Approximate Network Latency (RTT): ${conn.rtt} ms`;
  }
  return 'Network latency information is not supported.';
}

async function getHardwareInfo () {
  const cores = navigator.hardwareConcurrency || '?';
  const memory = navigator.deviceMemory || '?';
  const logicalW = screen.width;
  const logicalH = screen.height;
  const dpr = window.devicePixelRatio || 1;
  const physW = Math.round(logicalW * dpr);
  const physH = Math.round(logicalH * dpr);
  const screenRes = `${logicalW}×${logicalH} (CSS) / ${physW}×${physH} (Physically)`;
  const colorDepth = screen.colorDepth;

  let gpu = 'Unknown';
  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) {
        const vendor = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
        const renderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
        gpu = `${vendor} â€“ ${renderer}`;
      }
    }
  } catch (e) {}

  let batteryStr = 'Unknown';
  if (navigator.getBattery) {
    try {
      const bat = await navigator.getBattery();
      batteryStr = `Battery Level: ${(bat.level * 100).toFixed(0)}% / Charging: ${bat.charging}`;
    } catch (e) {}
  }

  return `CPU Cores: ${cores}\nRam: ${memory} GB\nScreen: ${screenRes}\nColor Depth: ${colorDepth} Bit\nGPU: ${gpu}\nBattery: ${batteryStr}`;
}

function getPlugins () {
  if (navigator.plugins && navigator.plugins.length) {
    const names = [...navigator.plugins].map(p => p.name).join(', ');
    return `Plugins: ${names}`;
  }
  return 'Could not retrieve the plugin list? *Not accessible on mobile devices*';
}

function getCookies () {
  try {
    document.cookie = 'test_cookie=1; SameSite=Lax';
    return document.cookie ? `Cookies:\n${document.cookie.split('; ').join('\n')}` : 'No cookies.';
  } catch (e) {
    return 'Cookies are not accessible.';
  }
}

async function getMediaDevices () {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return 'Not supported.';
  const devices = await navigator.mediaDevices.enumerateDevices();
  return devices.map(d => `${d.kind}: ${d.label || '(unlabeled)'}`).join('\n') || 'Device not found.';
}

async function getUserAgentData() {
  if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
    try {
      const uaData = await navigator.userAgentData.getHighEntropyValues([
        "model",
        "platformVersion"
      ]);
      const model = uaData.model || "Model could not be obtained";
      const platformVer = uaData.platformVersion || "Could not get version";
      return `Device Model: ${model}\n Operating System Version: ${platformVer}`;
    } catch (err) {
      return "Could not get userAgentData.";
    }
  } else {
    return "userAgentData is not supported.";
  }
}

function getRefreshRate(duration = 1000) {
  return new Promise(resolve => {
    let frames = 0;
    let start = performance.now();

    function count(time) {
      frames++;
      if (time - start < duration) {
        requestAnimationFrame(count);
      } else {
        const fps = (frames / ((time - start) / 1000)).toFixed(1);
        resolve(`Screen Hz: ${fps} Hz`);
      }
    }

    requestAnimationFrame(count);
  });
}

function getPixelDensity() {
  return `Device Pixel Ratio: ${window.devicePixelRatio}`;
}

function hasMouse() {
  return window.matchMedia("(pointer: fine)").matches ? "There is" : "none";
}

function hasTouchscreen() {
  return ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? "There is" : "None";
}

function getOrientation() {
  const orientation = (screen.orientation || {}).type || screen.mozOrientation || screen.msOrientation;
  return `Screen Orientation: ${orientation || 'Bilinmiyor'}`;
}

function isOnline() {
  return `Internet Status: ${navigator.onLine ? 'Online' : 'Offline'}`;
}

function getColorScheme() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'Dark Theme' : 'White Theme';
}


async function listGrantedPermissions() {
 const permissionTypes = [
    { name: 'camera', desc: 'Camera' },
    { name: 'microphone', desc: 'Microphone' },
    { name: 'geolocation', desc: 'Geolocation' },
    { name: 'clipboard-read', desc: 'Clipboard Reading' },
    { name: 'clipboard-write', desc: 'Clipboard Writing' }
  ];

  const grantedList = [];

  for (const perm of permissionTypes) {
    try {
      const result = await navigator.permissions.query({ name: perm.name });
      if (result.state === 'granted') {
        grantedList.push(`${perm.desc} this permission can be used âœ…`);
      }
    } catch (e) {
     //.
    }
  }

  if (grantedList.length === 0) {
    return 'Eh? Looks like the user never set any permissions to *always allow*?';
  } else {
    return 'Granted Permissions!:\n' + grantedList.join('\n');
  }
}

function getBrowservendorReferrerInfo() {
  return 'Vendor: ' + navigator.vendor +
         '\nCurrent URL: ' + location.href;
}

function getSaveDataMode() {
  return 'Save Data Mode: ' + (navigator.connection ? navigator.connection.saveData : 'Not supported');
}


function getMaxTouchPoints() {
  return 'Max Touch Points: ' + navigator.maxTouchPoints;
}


function getPluginCount() {
  return 'Plugins Installed: ' + navigator.plugins.length;
}

function getDoNotTrack() {
  return 'Do Not Track: ' + navigator.doNotTrack;
}


function getCpuArchitecture() {
  return 'CPU Architecture: ' + (navigator.platform || 'Unknown');
}
 

function getHostInfo() {
  return 'Host: ' + location.hostname + (location.port ? ':' + location.port : '');
}

function getPathInfo() {
  return 'Domain: ' + document.domain + '\nPath: ' + location.pathname;
}

function getappCodeName() {
  return 'AppCodeName: ' + navigator.appCodeName;
}

function getbaseurl() {
  return 'Base URL: ' + document.baseURI;
}



function getOSInfo() {
  const { userAgent } = navigator;
  if (userAgent.includes("Win")) return "Windows";
  if (userAgent.includes("Mac")) return "macOS";
  if (userAgent.includes("Linux")) return "Linux";
  if (userAgent.includes("Android")) return "Android";
  if (userAgent.includes("iOS")) return "iOS";
  return "unknown";
}


async function getGeoInfo() {
  try {
    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();

    return (
      "Region Code: " + data.region_code + "\n" +
      "Country: " + data.country + "\n" +
      "Country Name: " + data.country_name + "\n" +
      "Country Code: " + data.country_code + "\n" +
      "Country Code ISO3: " + data.country_code_iso3 + "\n" +
      "Country Calling Code: " + data.country_calling_code + "\n" +
      "Currency Name: " + data.currency_name + "\n" +
      "Country Population: " + data.country_population
    );
  } catch (err) {
    return "Geo Info: Error fetching data";
  }
}



function getPrimaryInputMethod() {
  if (window.matchMedia("(pointer: coarse)").matches) return "Primary Input: Touch";
  if (window.matchMedia("(hover: hover)").matches) return "Primary Input: Mouse";
  return "Primary Input: Keyboard or Unknown";
}

function getReducedMotionPreference() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches
    ? "Prefers Reduced Motion: Yes"
    : "Prefers Reduced Motion: No";
}


async function getBatteryTimes() {
  if (!navigator.getBattery) return 'Battery API not supported.';
  try {
    const bat = await navigator.getBattery();
    return `Battery Charging Time: ${bat.chargingTime === Infinity ? 'N/A' : bat.chargingTime + ' seconds'}\n` +
           `Battery Discharging Time: ${bat.dischargingTime === Infinity ? 'N/A' : bat.dischargingTime + ' seconds'}`;
  } catch {
    return 'Battery info unavailable.';
  }
}


function getTimeFormatPreference() {
  const test = new Date().toLocaleTimeString();
  return test.includes("AM") || test.includes("PM")
    ? "Time Format: 12-hour"
    : "Time Format: 24-hour";
}


function isDaylightSavingTime() {
  const now = new Date();
  const jan = new Date(now.getFullYear(), 0, 1);
  const jul = new Date(now.getFullYear(), 6, 1);
  const stdOffset = Math.max(jan.getTimezoneOffset(), jul.getTimezoneOffset());
  return now.getTimezoneOffset() < stdOffset;
}


async function getStorage() {
  if (navigator.storage && navigator.storage.estimate) {
    const estimate = await navigator.storage.estimate();
    return `Storage: ${estimate.usage} of ${estimate.quota} bytes used`;
  }
  return 'Storage API not supported.';
}


function getHistoryLength() {
  return 'History: ' + history.length +
        '\nHistory State: ' + history.state +
        '\nHistory scrollRestoration: ' + history.scrollRestoration;
}








function getGpuMemory() {
  const canvas = document.createElement('canvas');
  const gl = canvas.getContext('webgl');
  const gpuMemory = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  return `Bellek: ${gpuMemory}`;
}








function getBrowserExtraInfo() {
  try {
    return [
      `App Name: ${navigator.appName || 'Unknown'}`,
      `App Version: ${navigator.appVersion || 'Unknown'}`,
      `Product: ${navigator.product || 'Unknown'}`,
      `Product Sub: ${navigator.productSub || 'Unknown'}`,
      `Cookie Enabled: ${navigator.cookieEnabled ? 'Yes' : 'No'}`,
      `Java Enabled: ${typeof navigator.javaEnabled === 'function' ? (navigator.javaEnabled() ? 'Yes' : 'No') : 'Not supported'}`,
      `Online Status: ${navigator.onLine ? 'Online' : 'Offline'}`,
      `Document Referrer: ${document.referrer || '(none)'}`,
      `Character Set: ${document.characterSet || document.charset || 'Unknown'}`,
      `Compat Mode: ${document.compatMode || 'Unknown'}`,
      `Location Protocol: ${location.protocol}`,
      `Location Origin: ${location.origin}`,
      `Location Search: ${location.search || '(none)'}`,
      `Location Hash: ${location.hash || '(none)'}`
    ].join('\n');
  } catch (e) {
    return 'Browser extra info unavailable.';
  }
}






function getScreenExtraInfo() {
  try {
    const lines = [
      `Screen Avail: ${screen.availWidth} × ${screen.availHeight}`,
      `Screen Avail Offset: Left ${screen.availLeft || 0}, Top ${screen.availTop || 0}`,
      `Pixel Depth: ${screen.pixelDepth} bit`,
      `Window Inner: ${window.innerWidth} × ${window.innerHeight}`,
      `Window Outer: ${window.outerWidth} × ${window.outerHeight}`,
      `Window Screen Position: X ${window.screenX}, Y ${window.screenY}`,
      `Device Pixel Ratio: ${window.devicePixelRatio || 1}`
    ];

    if (window.visualViewport) {
      lines.push(
        `Visual Viewport: ${Math.round(window.visualViewport.width)} × ${Math.round(window.visualViewport.height)}`,
        `Visual Viewport Scale: ${window.visualViewport.scale.toFixed(3)}`
      );
    } else {
      lines.push('Visual Viewport: Not supported');
    }

    return lines.join('\n');
  } catch (e) {
    return 'Screen/window info unavailable.';
  }
}







function getGpuCapabilities() {
  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) return 'WebGL not supported.';

    const get = (param) => {
      try {
        const val = gl.getParameter(param);
        if (val === null || val === undefined) return 'N/A';
        if (Array.isArray(val) || (val.length !== undefined && typeof val !== 'string')) {
          return Array.from(val).join(', ');
        }
        return val;
      } catch {
        return 'N/A';
      }
    };

    const lines = [
      `MAX_TEXTURE_SIZE: ${get(gl.MAX_TEXTURE_SIZE)}`,
      `MAX_RENDERBUFFER_SIZE: ${get(gl.MAX_RENDERBUFFER_SIZE)}`,
      `MAX_VIEWPORT_DIMS: ${get(gl.MAX_VIEWPORT_DIMS)}`,
      `MAX_VERTEX_ATTRIBS: ${get(gl.MAX_VERTEX_ATTRIBS)}`,
      `MAX_VERTEX_UNIFORM_VECTORS: ${get(gl.MAX_VERTEX_UNIFORM_VECTORS)}`,
      `MAX_FRAGMENT_UNIFORM_VECTORS: ${get(gl.MAX_FRAGMENT_UNIFORM_VECTORS)}`,
      `ALIASED_LINE_WIDTH_RANGE: ${get(gl.ALIASED_LINE_WIDTH_RANGE)}`,
      `ALIASED_POINT_SIZE_RANGE: ${get(gl.ALIASED_POINT_SIZE_RANGE)}`,
      `MAX_COMBINED_TEXTURE_IMAGE_UNITS: ${get(gl.MAX_COMBINED_TEXTURE_IMAGE_UNITS)}`,
      `MAX_TEXTURE_IMAGE_UNITS: ${get(gl.MAX_TEXTURE_IMAGE_UNITS)}`,
      `MAX_VERTEX_TEXTURE_IMAGE_UNITS: ${get(gl.MAX_VERTEX_TEXTURE_IMAGE_UNITS)}`,
      `MAX_CUBE_MAP_TEXTURE_SIZE: ${get(gl.MAX_CUBE_MAP_TEXTURE_SIZE)}`,
      `MAX_VARYING_VECTORS: ${get(gl.MAX_VARYING_VECTORS)}`
    ];

    // Optional: list a few extensions
    try {
      const exts = gl.getSupportedExtensions();
      if (exts && exts.length) {
        lines.push(`Supported Extensions (${exts.length}): ${exts.slice(0, 8).join(', ')}${exts.length > 8 ? '…' : ''}`);
      }
    } catch {}

    return lines.join('\n');
  } catch (e) {
    return 'GPU capabilities unavailable.';
  }
}





function getDateTimeLocaleInfo() {
  try {
    const now = new Date();
    const tzOffset = now.getTimezoneOffset(); // minutes

    // DateTimeFormat
    const dtf = Intl.DateTimeFormat().resolvedOptions();
    // NumberFormat
    const nf = Intl.NumberFormat().resolvedOptions();
    // Collator
    let collatorInfo = 'Not available';
    try {
      const col = Intl.Collator().resolvedOptions();
      collatorInfo = `locale: ${col.locale}, sensitivity: ${col.sensitivity}, numeric: ${col.numeric}`;
    } catch {}

    return [
      `Timezone Offset: ${tzOffset} minutes (${tzOffset > 0 ? 'behind' : 'ahead of'} UTC)`,
      `DateTimeFormat → locale: ${dtf.locale}`,
      `DateTimeFormat → calendar: ${dtf.calendar}`,
      `DateTimeFormat → numberingSystem: ${dtf.numberingSystem}`,
      `DateTimeFormat → timeZone: ${dtf.timeZone}`,
      `DateTimeFormat → hour12: ${dtf.hour12}`,
      `DateTimeFormat → hourCycle: ${dtf.hourCycle || 'N/A'}`,
      `NumberFormat → locale: ${nf.locale}`,
      `NumberFormat → numberingSystem: ${nf.numberingSystem}`,
      `NumberFormat → style: ${nf.style}`,
      `Collator: ${collatorInfo}`
    ].join('\n');
  } catch (e) {
    return 'Date/Time/Locale info unavailable.';
  }
}












/* ==================================================
   1. DEVICE / PLATFORM INFO (works on all devices)
   ================================================== */
async function getDevicePlatformInfo() {
  const lines = [];

  // Basic fallback
  lines.push(`Platform: ${navigator.platform || 'Unknown'}`);
  lines.push(`User Agent: ${navigator.userAgent}`);

  // Modern User-Agent Client Hints (Chrome, Edge, Opera, Samsung Internet, Android Chrome...)
  if (navigator.userAgentData) {
    try {
      const lowEntropy = navigator.userAgentData;
      lines.push(`Mobile: ${lowEntropy.mobile ? 'Yes' : 'No'}`);
      lines.push(`Brands: ${lowEntropy.brands.map(b => `${b.brand} ${b.version}`).join(', ')}`);

      // High entropy values (may be restricted on some browsers)
      const high = await navigator.userAgentData.getHighEntropyValues([
        "model",
        "platform",
        "platformVersion",
        "architecture",
        "bitness",
        "fullVersionList",
        "formFactors",
        "wow64",
        "uaFullVersion"
      ]);

      if (high.model)              lines.push(`Device Model: ${high.model}`);
      if (high.platform)           lines.push(`OS Platform: ${high.platform}`);
      if (high.platformVersion)    lines.push(`OS Version: ${high.platformVersion}`);
      if (high.architecture)       lines.push(`Architecture: ${high.architecture}`);
      if (high.bitness)            lines.push(`Bitness: ${high.bitness}`);
      if (high.formFactors?.length) lines.push(`Form Factors: ${high.formFactors.join(', ')}`);
      if (high.wow64 !== undefined) lines.push(`WoW64: ${high.wow64 ? 'Yes' : 'No'}`);

      if (high.fullVersionList?.length) {
        lines.push('Full Version List:');
        high.fullVersionList.forEach(b => {
          lines.push(`  • ${b.brand}: ${b.version}`);
        });
      }
    } catch (e) {
      lines.push('High-entropy Client Hints: restricted or not available');
    }
  } else {
    lines.push('User-Agent Client Hints: not supported');
  }

  return lines.join('\n');
}

/* ==================================================
   2. NETWORK INFO (works on all devices)
   ================================================== */
function getNetworkInfoExtra() {
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

  if (!conn) {
    return 'Network Information API: not supported on this browser/device';
  }

  return [
    `Connection Type: ${conn.type || 'Unknown'}`,
    `Effective Type: ${conn.effectiveType || 'Unknown'}`,
    `Downlink: ${conn.downlink ?? '?'} Mb/s`,
    `Downlink Max: ${conn.downlinkMax ?? 'Unknown'}`,
    `RTT: ${conn.rtt ?? '?'} ms`,
    `Save Data Mode: ${conn.saveData ? 'Yes' : 'No'}`
  ].join('\n');
}

/* ==================================================
   3. INPUT CAPABILITIES (works on all devices)
   ================================================== */
function getInputCapabilities() {
  const lines = [
    `Max Touch Points: ${navigator.maxTouchPoints ?? 0}`,
    `Touch Events: ${('ontouchstart' in window) ? 'Yes' : 'No'}`,
    `Pointer: Fine → ${window.matchMedia('(pointer: fine)').matches ? 'Yes' : 'No'}`,
    `Pointer: Coarse → ${window.matchMedia('(pointer: coarse)').matches ? 'Yes' : 'No'}`,
    `Any Pointer Fine → ${window.matchMedia('(any-pointer: fine)').matches ? 'Yes' : 'No'}`,
    `Any Pointer Coarse → ${window.matchMedia('(any-pointer: coarse)').matches ? 'Yes' : 'No'}`,
    `Hover: ${window.matchMedia('(hover: hover)').matches ? 'Yes' : 'No'}`,
    `Any Hover: ${window.matchMedia('(any-hover: hover)').matches ? 'Yes' : 'No'}`,
    `Primary Input: ${
      window.matchMedia('(pointer: coarse)').matches ? 'Touch' :
      window.matchMedia('(hover: hover)').matches ? 'Mouse' : 'Keyboard / Unknown'
    }`
  ];

  return lines.join('\n');
}

  <header>

  <div class="wrap">
    <div class="grid">
      <section class="card pad">
        <div class="row">
          <h2 class="small">Input</h2>
          <span class="pill" id="countIn">0 characters</span>
        </div>

        <textarea
          id="input"
          class="area"
          placeholder="Type here!"
        ></textarea>

          <button class="primary" id="toSymbols">Convert</button>
          <button class="accent2" id="toLetters">Convert Back</button>
          <button class="ghost" id="clear">Clear</button>
          <button id="copy" class="primary">Copy</button>
        </div>
      </section>

      <section class="card pad">
        <div class="row">
          <h2 class="small">Output</h2>
          <span class="pill" id="countOut">0 characters</span>
        </div>

        <textarea
          id="output"
          class="area"
          placeholder="The result will appear here!"
          readonly
        ></textarea>
      </section>
    </div>

  <script>
const MAP = {
  "A": "∞", "B": "★", "C": "♡", "Ç": "⌬", "D": "✡", "E": "𖦹", "F": "❖", "G": "⨂", "Ğ": "𖣘", "H": "✩",
  "I": "⨊", "İ": "⌔", "J": "✮", "K": "⊙", "L": "✪", "M": "☾", "N": "⸘", "O": "֍", "Ö": "⍟", "P": "⚬",
  "Q": "⟡", "R": "♢", "S": "☯", "Ş": "✵", "T": "✦", "U": "✰", "Ü": "☮", "V": "‡", "W": "❈", "X": "◇",
  "Y": "𖤐", "Z": "✯"
};

    const REVERSE = Object.fromEntries(
      Object.entries(MAP).map(([k, v]) => [v, k])
    );

    const elIn = document.getElementById('input');
    const elOut = document.getElementById('output');
    const btnToSymbols = document.getElementById('toSymbols');
    const btnToLetters = document.getElementById('toLetters');
    const btnCopy = document.getElementById('copy');
    const btnClear = document.getElementById('clear');
    const countIn = document.getElementById('countIn');
    const countOut = document.getElementById('countOut');

    const tr = 'tr-TR';

    function updateCounts() {
      countIn.textContent = `${elIn.value.length} characters`;
      countOut.textContent = `${elOut.value.length} characters`;
    }

    function toSymbols(text) {
      let out = '';

      for (const ch of text) {
        const upper = ch.toLocaleUpperCase(tr);
        out += MAP[upper] ?? ch;
      }

      return out;
    }

    function toLettersRaw(text) {
      let out = '';

      for (const ch of text) {
        if (REVERSE[ch]) {
          out += REVERSE[ch].toLocaleLowerCase(tr);
        } else {
          out += ch;
        }
      }

      return out;
    }

    function titleCaseTR(text) {
      return text.replace(/\p{L}+/gu, (word) => {
        const first = word.slice(0, 1).toLocaleUpperCase(tr);
        const rest = word.slice(1).toLocaleLowerCase(tr);

        return first + rest;
      });
    }

    btnToSymbols.addEventListener('click', () => {
      elOut.value = toSymbols(elIn.value);
      updateCounts();
    });

    btnToLetters.addEventListener('click', () => {
      const raw = toLettersRaw(elIn.value);
      elOut.value = titleCaseTR(raw);
      updateCounts();
    });

    btnCopy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(elOut.value);
        btnCopy.textContent = '✓ Copied';

        setTimeout(() => {
          btnCopy.textContent = 'Copy This Text';
        }, 1200);
      } catch (e) {
        elOut.select();
        document.execCommand('copy');
      }
    });

    btnClear.addEventListener('click', () => {
      elIn.value = '';
      elOut.value = '';
      updateCounts();
      elIn.focus();
    });

    elIn.addEventListener('input', updateCounts);
    updateCounts();
  </script>
